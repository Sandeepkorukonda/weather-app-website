<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Live Weather</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <div class="searchBar">
        <div class="searchBarParentDiv">
            <input type="text" class="inputfield" placeholder="Search City">
            <img src="./search.png" alt="Search" width="35px" class="searchIcon" id="searchBtn">
        </div>
        <!-- Shows "City not found" and other errors -->
        <div id="errorMsg" role="alert" style="display:none; color:#b00020; text-align:center; margin-top:8px;"></div>
    </div>

    <div class="mainContentParentDiv d-flex">
        <div class="leftDiv">
            <div class="currentTempDiv leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="cityName">City Name</h6>
                <h5 class="m-0"> <span id="cityTemp">-</span> &deg;C</h5>
                <h6 class="m-0" id="skyDesc">Sky Description</h6>
                <hr class="line">
                <div class="d-flex gap-2">
                    <img src="./calendar.png" alt="" width="25px">
                    <h6 class="m-0" id="date">Date</h6>
                </div>
                <div class="d-flex gap-2">
                    <img src="./time.png" alt="" width="25px">
                    <h6 class="m-0" id="time">Time</h6>
                </div>
            </div>

            <div class="nextFiveDays leftChild p-3 d-flex flex-column gap-2">
                <h6 class="m-0" id="comingFiveDaysTitle">Coming 5 Days</h6>
                <div id="forecastContainer" class="d-flex flex-column gap-1"></div>
            </div>
        </div>

        <div class="rightDiv">
            <div class="rightRow rowOne d-flex gap-2 justify-content-between align-items-center">
                <div class="extraMetric d-flex gap-3">
                    <img src="./flood.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Humidity</h6>
                        <h6 class="m-0" id="humidity">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./wind (1).png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Pressure</h6>
                        <h6 class="m-0" id="pressure">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./hot.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Feels like</h6>
                        <h6 class="m-0" id="feelsLike">-</h6>
                    </div>
                </div>
                <div class="extraMetric d-flex gap-3">
                    <img src="./eye.png" alt="" width="35px">
                    <div>
                        <h6 class="m-0">Visibility</h6>
                        <h6 class="m-0" id="visibility">-</h6>
                    </div>
                </div>
            </div>

            <div class="rightRow rowTwo d-flex justify-content-between align-items-center">
                <div class="AQI rowTwoDiv p-3 d-flex flex-column gap-2">
                    <h5>Air Quality Index (AQI) <small>(&micro;g/m&sup3;)</small></h5>

                    <div class="d-flex align-items-center justify-content-between">
                        <img src="./wind.png" alt="" width="40px">
                        <div class="text-center">
                            <h6 id="co">CO</h6>
                            <h6 id="coValue">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="so2">SO2</h6>
                            <h6 id="so2Value">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="o3">O3</h6>
                            <h6 id="o3Value">-</h6>
                        </div>
                        <div class="text-center">
                            <h6 id="no2">NO2</h6>
                            <h6 id="no2Value">-</h6>
                        </div>
                    </div>
                </div>

                <div class="sunRise rowTwoDiv p-3 gap-2">
                    <h5 class="m-0">Sunrise &amp; Sunset</h5>

                    <div class="d-flex justify-content-between">
                        <div class="sunriseDiv d-flex gap-2 align-items-center">
                            <img src="./sun (1).png" alt="" width="75px">
                            <div class="d-flex flex-column gap-1">
                                <h6 class="m-0">Sunrise</h6>
                                <h5 class="m-0" id="sunriseTime">-:-- AM</h5>
                            </div>
                        </div>

                        <div class="sunsetDiv d-flex gap-2 align-items-center">
                            <img src="./moon.png" alt="" width="65px">
                            <div class="d-flex flex-column gap-2">
                                <h6 class="m-0">Sunset</h6>
                                <h5 class="m-0" id="sunsetTime">-:-- PM</h5>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="rightRow rowThree d-flex flex-column gap-2">
                <h5 class="m-0">Next hours</h5>
                <div class="d-flex justify-content-between todayTempParentDiv" id="todayTempContainer"></div>
            </div>
        </div>
    </div>

    <script>
        // Paste your NEW OpenWeatherMap key here (and revoke the old ones in your dashboard).
        const API_KEY = "224920923eeb6e1946eb085784cafe80";
        const BASE = "https://api.openweathermap.org/data/2.5";

        const $ = (id) => document.getElementById(id);

        // ---------- helpers ----------
        // OpenWeather gives times as UTC seconds plus the city's UTC offset (seconds).
        // Shifting by the offset and formatting as UTC shows the CITY's local time,
        // no matter where the visitor's browser is.
        function cityDate(ts, tz) {
            return new Date((ts + tz) * 1000);
        }
        function formatTime(ts, tz) {
            return cityDate(ts, tz).toLocaleTimeString("en-US", {
                timeZone: "UTC", hour: "numeric", minute: "2-digit", hour12: true
            });
        }
        function formatDate(ts, tz) {
            return cityDate(ts, tz).toLocaleDateString("en-US", {
                timeZone: "UTC", day: "numeric", month: "short", year: "numeric"
            });
        }
        function dateKey(ts, tz) {
            return cityDate(ts, tz).toISOString().slice(0, 10); // YYYY-MM-DD in city time
        }
        function iconUrl(code) {
            return `https://openweathermap.org/img/wn/${code}.png`;
        }
        function showError(message) {
            const box = $("errorMsg");
            box.textContent = message;
            box.style.display = message ? "block" : "none";
        }

        // ---------- air quality ----------
        async function fetchAQIData(lat, lon) {
            try {
                const res = await fetch(`${BASE}/air_pollution?lat=${lat}&lon=${lon}&appid=${API_KEY}`);
                if (!res.ok) throw new Error("AQI request failed");
                const data = await res.json();
                const c = data.list[0].components;
                $("coValue").innerText = c.co;
                $("so2Value").innerText = c.so2;
                $("o3Value").innerText = c.o3;
                $("no2Value").innerText = c.no2;
            } catch (err) {
                console.error(err);
                ["coValue", "so2Value", "o3Value", "no2Value"].forEach((id) => ($(id).innerText = "N/A"));
            }
        }

        // ---------- forecast (one request, used for both sections) ----------
        async function fetchForecast(lat, lon) {
            try {
                const res = await fetch(`${BASE}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`);
                if (!res.ok) throw new Error("Forecast request failed");
                const data = await res.json();
                const tz = data.city.timezone;
                renderFiveDays(data.list, tz);
                renderNextHours(data.list, tz);
            } catch (err) {
                console.error(err);
                $("forecastContainer").innerHTML = "<h6 class='m-0'>Forecast unavailable</h6>";
                $("todayTempContainer").innerHTML = "";
            }
        }

        function renderFiveDays(list, tz) {
            const days = {};
            list.forEach((item) => {
                const key = dateKey(item.dt, tz);
                const hour = cityDate(item.dt, tz).getUTCHours();
                if (!days[key]) {
                    days[key] = { min: item.main.temp_min, max: item.main.temp_max, icon: item.weather[0].icon, gap: 99 };
                }
                const d = days[key];
                d.min = Math.min(d.min, item.main.temp_min);
                d.max = Math.max(d.max, item.main.temp_max);
                // use the reading closest to midday as the day's icon
                const gap = Math.abs(hour - 12);
                if (gap < d.gap) {
                    d.gap = gap;
                    d.icon = item.weather[0].icon;
                }
            });

            let html = "";
            Object.keys(days).slice(0, 5).forEach((key) => {
                const d = days[key];
                const dayName = new Date(key + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" });
                html += `
                    <div class="forecastRow d-flex align-items-center justify-content-between">
                        <div class="d-flex gap-1 align-items-center">
                            <img src="${iconUrl(d.icon)}" alt="" width="35px">
                            <h6 class="m-0">${Math.round(d.max)}&deg; / ${Math.round(d.min)}&deg;C</h6>
                        </div>
                        <h6 class="m-0">${dayName}</h6>
                        <h6 class="m-0">${key}</h6>
                    </div>`;
            });
            $("forecastContainer").innerHTML = html;
        }

        function renderNextHours(list, tz) {
            const now = Math.floor(Date.now() / 1000);
            // each forecast entry covers 3 hours, so keep the one we're currently inside
            const upcoming = list.filter((item) => item.dt >= now - 10800).slice(0, 6);

            let html = "";
            upcoming.forEach((item) => {
                html += `
                    <div class="todayTemp">
                        <h6 class="m-0">${formatTime(item.dt, tz)}</h6>
                        <img src="${iconUrl(item.weather[0].icon)}" alt="" width="35px">
                        <h5>${item.main.temp.toFixed(1)}&deg;C</h5>
                    </div>`;
            });
            $("todayTempContainer").innerHTML = html;
        }

        // ---------- main search ----------
        async function fetchData() {
            const cityName = document.getElementsByClassName("inputfield")[0].value.trim();
            if (!cityName) {
                showError("Please type a city name.");
                return;
            }

            try {
                const res = await fetch(`${BASE}/weather?q=${encodeURIComponent(cityName)}&appid=${API_KEY}&units=metric`);
                const data = await res.json();

                if (!res.ok) {
                    showError(res.status === 404 ? `City "${cityName}" not found. Check the spelling and try again.`
                                                 : "Could not get weather data. Please try again later.");
                    return;
                }
                showError("");

                const tz = data.timezone;

                $("cityName").innerText = `${data.name}, ${data.sys.country}`;
                $("cityTemp").innerText = data.main.temp.toFixed(1);
                $("skyDesc").innerText = data.weather[0].description;
                $("humidity").innerText = `${data.main.humidity} %`;
                $("pressure").innerText = `${data.main.pressure} hPa`;
                $("feelsLike").innerText = `${data.main.feels_like.toFixed(1)} \u00B0C`;
                $("visibility").innerText = `${(data.visibility / 1000).toFixed(1)} km`;

                // date and time in the searched city's local time
                $("date").innerText = formatDate(data.dt, tz);
                $("time").innerText = formatTime(data.dt, tz);

                $("sunriseTime").innerText = formatTime(data.sys.sunrise, tz);
                $("sunsetTime").innerText = formatTime(data.sys.sunset, tz);

                const { lat, lon } = data.coord;
                fetchAQIData(lat, lon);
                fetchForecast(lat, lon);
            } catch (err) {
                console.error(err);
                showError("Network error. Check your connection and try again.");
            }
        }

        // click the icon or press Enter to search
        $("searchBtn").addEventListener("click", fetchData);
        document.getElementsByClassName("inputfield")[0].addEventListener("keydown", (e) => {
            if (e.key === "Enter") fetchData();
        });
    </script>
</body>

</html>
